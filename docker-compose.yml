version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bms-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - ./docker/mosquitto/data:/mosquitto/data
      - ./docker/mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    container_name: bms-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./docker/influxdb/data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=password123
      - DOCKER_INFLUXDB_INIT_ORG=bms-org
      - DOCKER_INFLUXDB_INIT_BUCKET=bms-data
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=bms-super-secret-token

  grafana:
    image: grafana/grafana-oss:latest
    container_name: bms-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/data:/var/lib/grafana